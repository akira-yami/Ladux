# Production compose (run from repository root):
# `docker compose --env-file .env.production -f backend/docker-compose.prod.yml up -d --build`.
# `--env-file` supplies the explicitly mapped runtime and build variables.
# Caddy is the only service published to the host. App, PostgreSQL and Redis
# communicate through Docker-only networks.
services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET required}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD required}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:?VNPAY_TMN_CODE required}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:?VNPAY_HASH_SECRET required}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:?VNPAY_PAY_URL required}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:?VNPAY_RETURN_URL required}
      VNPAY_REFUND_URL: ${VNPAY_REFUND_URL:?VNPAY_REFUND_URL required}
      VNPAY_QUERY_URL: ${VNPAY_QUERY_URL:?VNPAY_QUERY_URL required}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:?VNPAY_IPN_URL required}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY required}
      GOOGLE_GENAI_API_KEY: ${GOOGLE_GENAI_API_KEY:?GOOGLE_GENAI_API_KEY required}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS required}
      OAUTH2_SUCCESS_REDIRECT: ${OAUTH2_SUCCESS_REDIRECT:?OAUTH2_SUCCESS_REDIRECT required}
      OAUTH2_FAILURE_REDIRECT: ${OAUTH2_FAILURE_REDIRECT:?OAUTH2_FAILURE_REDIRECT required}
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_SAME_SITE: Strict
      UPLOAD_ROOT: /app/uploads
      CAPTCHA_ENABLED: "true"
      CAPTCHA_SECRET: ${CAPTCHA_SECRET:?CAPTCHA_SECRET required}
      CAPTCHA_EXPECTED_HOSTNAME: ${LADUX_WEB_DOMAIN:?LADUX_WEB_DOMAIN required}
      CAPTCHA_EXPECTED_ACTION: login
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      ORDER_SHIPPING_FEE: ${ORDER_SHIPPING_FEE:-30000}
      ORDER_CARRIER: ${ORDER_CARRIER:-VNPOST}
      VNPAY_EXPIRE_MINUTES: ${VNPAY_EXPIRE_MINUTES:-15}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proxy-network
      - data-network
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 40s
    mem_limit: 1536m

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: https://${LADUX_WEB_DOMAIN:?LADUX_WEB_DOMAIN required}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:?VITE_RECAPTCHA_SITE_KEY required}
        VITE_SITE_URL: https://${LADUX_WEB_DOMAIN:?LADUX_WEB_DOMAIN required}
        VITE_ALLOW_INDEXING: ${LADUX_ALLOW_INDEXING:-true}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ladux
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - data-network
  caddy:
    image: caddy:2
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:?CADDY_EMAIL required}
      LADUX_API_DOMAIN: ${LADUX_API_DOMAIN:?LADUX_API_DOMAIN required}
      LADUX_WEB_DOMAIN: ${LADUX_WEB_DOMAIN:?LADUX_WEB_DOMAIN required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - proxy-network
    restart: unless-stopped

  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data-network
    volumes:
      - redis-data:/data
    # Gioi han bo nho: cache + bucket rate-limit khong duoc tang den het RAM host.
    # allkeys-lru: khi day, loai cache/bucket cu nhat (mat bucket chi reset gioi han, khong mat du lieu nghiep vu).
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    mem_limit: 384m

volumes:
  postgres-data:
  redis-data:
  caddy_data:
  caddy_config:
  uploads-data:

networks:
  proxy-network:
    driver: bridge
  data-network:
    driver: bridge
    internal: true
