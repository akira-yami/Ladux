server.port=8080
# DTO package names changed; isolate serialized Spring Cache entries from the previous build.
spring.cache.redis.key-prefix=ladux:modules:v1:
# Chọn profile mặc định là 'dev' nếu không cấu hình gì thêm
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Cấu hình chung cho JPA
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.json_format_mapper=jackson

# Đọc thông tin kết nối DB từ biến môi trường (Dùng chung cho cả dev và prod)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/ladux
spring.datasource.username=${DB_USERNAME:akira}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# KHÔNG ĐỂ MẶC ĐỊNH (FALLBACK) CHO CÁC CHUỖI MẬT TRÊN PROD
app.jwt.secret=${JWT_SECRET}
# Access token song ngan (15 phut), refresh token song dai (7 ngay) - tinh bang mili-giay.
app.jwt.access-expiration=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

app.auth.cookie.refresh-name=${AUTH_COOKIE_REFRESH_NAME:REFRESH_TOKEN}
app.auth.cookie.admin-refresh-name=${ADMIN_AUTH_COOKIE_REFRESH_NAME:ADMIN_REFRESH_TOKEN}
app.auth.cookie.refresh-path=${AUTH_COOKIE_REFRESH_PATH:/api/v1/auth}
app.auth.cookie.admin-refresh-path=${ADMIN_AUTH_COOKIE_REFRESH_PATH:/api/v1/admin/auth}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
app.auth.device-cookie.name=${AUTH_DEVICE_COOKIE_NAME:DEVICE_TOKEN}
app.auth.device-cookie.same-site=${AUTH_DEVICE_COOKIE_SAME_SITE:Strict}
app.auth.device-cookie.secure=${AUTH_DEVICE_COOKIE_SECURE:${AUTH_COOKIE_SECURE:true}}

# Development defaults only. application-prod.properties requires explicit real origins.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

spring.web.resources.static-locations=classpath:/static/

app.upload.root=${UPLOAD_ROOT:../uploads}
app.upload.product-dir=products
app.upload.avatar-dir=avatar
app.upload.category-dir=categories
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Giám sát ứng dụng
# ===== Actuator / Health probes =====
# Chi expose cac endpoint can thiet ra HTTP (tranh lo thong tin nhay cau hinh).
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Bat liveness & readiness probe (dung cho Docker/K8s).
management.endpoint.health.probes.enabled=true
# Chi hien chi tiet health (vd trang thai DB/Redis) cho request da xac thuc.
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=when_authorized
# Bao gom DB & Redis vao readiness de container chi "ready" khi phu thuoc san sang.
management.endpoint.health.group.readiness.include=readinessState,db,redis

# ===== Distributed rate limiting (Bucket4j + Redis) =====
# Bucket Redis duoc chia se giua moi backend instance.
app.rate-limit.login.capacity=5
app.rate-limit.login.refill-minutes=1
app.rate-limit.login.account-capacity=${LOGIN_ACCOUNT_RATE_LIMIT_CAPACITY:5}
app.rate-limit.login.account-refill-minutes=${LOGIN_ACCOUNT_RATE_LIMIT_REFILL_MINUTES:15}
app.rate-limit.login.ip-account-capacity=${LOGIN_IP_ACCOUNT_RATE_LIMIT_CAPACITY:3}
app.rate-limit.login.ip-account-refill-minutes=${LOGIN_IP_ACCOUNT_RATE_LIMIT_REFILL_MINUTES:10}
app.rate-limit.admin-login.capacity=${ADMIN_LOGIN_RATE_LIMIT_CAPACITY:5}
app.rate-limit.admin-login.refill-minutes=${ADMIN_LOGIN_RATE_LIMIT_REFILL_MINUTES:1}
app.rate-limit.mfa.ip-capacity=${MFA_IP_RATE_LIMIT_CAPACITY:5}
app.rate-limit.mfa.ip-refill-minutes=${MFA_IP_RATE_LIMIT_REFILL_MINUTES:1}
app.rate-limit.mfa.account-capacity=${MFA_ACCOUNT_RATE_LIMIT_CAPACITY:5}
app.rate-limit.mfa.account-refill-minutes=${MFA_ACCOUNT_RATE_LIMIT_REFILL_MINUTES:10}
app.rate-limit.mfa.challenge-capacity=${MFA_CHALLENGE_RATE_LIMIT_CAPACITY:5}
app.rate-limit.mfa.challenge-refill-minutes=${MFA_CHALLENGE_RATE_LIMIT_REFILL_MINUTES:10}
app.rate-limit.register.capacity=5
app.rate-limit.register.refill-minutes=1
app.rate-limit.otp-send.capacity=3
app.rate-limit.otp-send.ip-capacity=3
app.rate-limit.otp-send.refill-minutes=1
app.rate-limit.chatbot.capacity=15
app.rate-limit.chatbot.refill-minutes=1
app.rate-limit.order-create.capacity=5
app.rate-limit.order-create.refill-minutes=1
app.rate-limit.payment-retry.capacity=3
app.rate-limit.payment-retry.refill-minutes=1
app.rate-limit.search.capacity=60
app.rate-limit.search.refill-minutes=1

# Chính sách giao hàng dùng chung cho cart preview và lúc tạo order.
app.order.shipping-fee=${ORDER_SHIPPING_FEE:30000}
app.order.carrier=${ORDER_CARRIER:VNPOST}

# Fixed OTP dùng cho luồng xác thực số điện thoại hiện tại.
app.phone-otp.fixed-code=${PHONE_OTP_FIXED_CODE:123456}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Tránh request bị treo quá lâu nếu Gmail lỗi
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.mail.default-encoding=UTF-8

# Cấu hình OTP email
app.email.from=${MAIL_USERNAME:laduxshop@gmail.com}
app.contact.receiver-email=${CONTACT_RECEIVER_EMAIL:laduxshop@gmail.com}
app.email-otp.expires-in-seconds=300
app.email-otp.resend-cooldown-seconds=60
app.email-otp.max-failed-attempts=5

# CAPTCHA is always verified by the backend. Use a provider endpoint compatible
# with reCAPTCHA/hCaptcha and configure the secret only through the environment.
app.captcha.enabled=${CAPTCHA_ENABLED:true}
app.captcha.verify-url=${CAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}
app.captcha.secret=${CAPTCHA_SECRET:}
app.captcha.expected-hostname=${CAPTCHA_EXPECTED_HOSTNAME:}
app.captcha.expected-action=${CAPTCHA_EXPECTED_ACTION:}

# TOTP secrets are AES-GCM encrypted at rest. MFA_ENCRYPTION_KEY must be a Base64 AES key.
app.mfa.encryption-key=${MFA_ENCRYPTION_KEY:}
app.mfa.challenge.ttl-seconds=${MFA_CHALLENGE_TTL_SECONDS:300}
app.mfa.challenge.max-attempts=${MFA_CHALLENGE_MAX_ATTEMPTS:5}
app.mfa.totp.period-seconds=${MFA_TOTP_PERIOD_SECONDS:30}
app.mfa.totp.digits=${MFA_TOTP_DIGITS:6}
app.mfa.fixed-code=${MFA_FIXED_CODE:}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

app.oauth2.success-redirect=${OAUTH2_SUCCESS_REDIRECT:http://localhost:5173/auth/oauth2/success}
app.oauth2.failure-redirect=${OAUTH2_FAILURE_REDIRECT:http://localhost:5173/login?oauth2Error=true}

# VNPay configuration
payment.vnpay.tmn-code=${VNPAY_TMN_CODE}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET}
payment.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
payment.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay/return}
payment.vnpay.refund-url=${VNPAY_REFUND_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
payment.vnpay.expire-minutes=${VNPAY_EXPIRE_MINUTES:15}
payment.vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay-webhook}

# Chatbot: DeepSeek chat + Gemini embeddings cho RAG sản phẩm
spring.main.allow-bean-definition-overriding=true
spring.ai.vectorstore.pgvector.dimensions=3072
spring.ai.vectorstore.pgvector.index-type=NONE
spring.ai.vectorstore.pgvector.initialize-schema=true

spring.ai.model.chat=deepseek
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
spring.ai.deepseek.chat.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
spring.ai.deepseek.chat.model=${DEEPSEEK_MODEL:deepseek-v4-flash}
spring.ai.deepseek.chat.temperature=${DEEPSEEK_TEMPERATURE:0.3}

spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.api-key=${GOOGLE_GENAI_API_KEY:}
