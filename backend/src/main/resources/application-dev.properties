spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.locations=classpath:db/migration,classpath:db/devdata
# Du lieu mau chi chay trong profile dev qua db/devdata, production chi dung db/migration.
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
# Fail on checksum/schema mismatches; existing data requires an explicit migration review.
spring.sql.init.mode=never
spring.data.redis.host=redis
spring.data.redis.port=6379

# Local development uses HTTP. Secure cookies are enabled again by the production profile.
app.auth.cookie.secure=false
app.auth.device-cookie.secure=false

# Explicitly use Redis as the caching provider for @EnableCaching + @Cacheable/@CacheEvict
spring.cache.type=redis

# Local: backend cwd = backend/ → project root uploads/
# Docker: set UPLOAD_ROOT=/app/uploads (compose bind-mounts ../uploads)
app.upload.root=${UPLOAD_ROOT:../uploads}

# Làm Redis kết nối ổn định hơn trong Docker (tránh crash context nếu Redis chậm)
spring.data.redis.timeout=10000ms
spring.data.redis.connect-timeout=10000ms
spring.cache.redis.time-to-live=600000

# Local development can opt in with CAPTCHA_ENABLED=true and CAPTCHA_SECRET.
app.captcha.enabled=${CAPTCHA_ENABLED:false}
