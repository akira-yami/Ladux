name: CI

on:
  push:
    branches: [main, "fix/**", "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Unit and integration tests (Testcontainers)
        run: mvn -B -f backend/pom.xml clean verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend dependency security gate
        run: |
          mvn -B -f backend/pom.xml dependency:tree -DoutputType=json -DoutputFile="${GITHUB_WORKSPACE}/output/backend-dependencies.json"
          node scripts/audit-maven.mjs
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - name: Production configuration gates
        run: node --test ../scripts/preflight.test.mjs ../scripts/check-vnpay.test.mjs
