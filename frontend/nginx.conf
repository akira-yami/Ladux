server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed assets; missing assets must return a real 404.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Avoid serving an old entry point after deploying a new build.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # React Router handles storefront and admin routes on the client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
